name: Publish nightly release on GitHub
on:
  schedule:
    - cron: '0 0 * * *'
      timezone: 'UTC'
  workflow_dispatch:

jobs:

  bump_tag:
    name: Bump Git tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Update tag if outdated
        id: update-tag
        run: |
          if [ "$(git rev-list -n 1 HEAD)" != "$(git rev-list -n 1 tags/nightly-ng)" ]; then
            git tag -f nightly-ng
            echo "Tag updated: $(git rev-list -n 1 tags/nightly-ng)"
          else
            echo "Tag is up-to-date."
          fi

      - name: Push tag
        run: git push -f origin nightly-ng

  publish:
    name: "Publish VSIX"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
      
      - name: Set up AdvanceCOMP
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get -y install advancecomp

      - name: Update version number
        run: |
          suffix="nightly-$(date --utc +'%Y%m%d')"
          version="$(jq '.version' package.json | sed 's/-.*"/"/' | sed 's/"$/'-"${suffix}"'"/')
          jq ".version |= ${version}" package.json > package.json.new
          mv package.json.new package.json

      - name: Install dependencies
        run: npm install

      - name: Run TypeScript compiler
        run: npx tsc

      - name: Build VSIX bundle
        uses: HaaLeo/publish-vscode-extension@1b8df468b849f76a143b8c18bf0ffa2075398d12 # == v2.1.0
        id: build-vsix
        with:
          dryRun: true
          pat: 'stub'
          preRelease: true
      
      - name: Recompress VSIX bundle
        run: advzip -z4 ${{ steps.build-vsix.outputs.vsixPath }}

      - name: Publish nightly release
        uses: WebFreak001/deploy-nightly@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: https://uploads.github.com/repos/Pure-D/code-d/releases/448911670/assets{?name,label}
          release_id: 448911670
          asset_path: ${{ steps.build-vsix.outputs.vsixPath }}
          asset_name: code-d_nightly_$$.vsix
          asset_content_type: application/octet-stream # alternatively: application/zip
